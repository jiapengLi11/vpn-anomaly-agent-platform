name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -v
      - run: python tools/generate_demo.py
      - run: python tools/evaluate_knowledge.py --fail-on-gate
      - run: python tools/run_answer_quality.py --provider demo --output evaluation/runs/demo-extractive-20260908-v1.json --overwrite --recorded-at 2026-09-08T03:00:49+00:00
      - run: python tools/evaluate_answer_quality.py --run evaluation/runs/demo-extractive-20260908-v1.json --fail-on-gate
      - run: git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node --test tests/*.test.js
        working-directory: frontend
